name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # Build Release Binary (amd64 Linux only, with eBPF support)
  # ===========================================================================
  build:
    name: Build Release Binary (eBPF)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install BPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libbpf-dev linux-libc-dev

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-x86_64-unknown-linux-gnu-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-unknown-linux-gnu-cargo-release-

      - name: Compile BPF objects
        run: |
          set -e
          ARCH_INCLUDE=""
          if [[ -d "/usr/include/$(uname -m)-linux-gnu" ]]; then
            ARCH_INCLUDE="-I/usr/include/$(uname -m)-linux-gnu"
          fi
          clang -O2 -g -target bpf ${ARCH_INCLUDE} \
              -c bpf/limiter.bpf.c -o bpf/limiter.bpf.o
          clang -O2 -g -target bpf ${ARCH_INCLUDE} \
              -c bpf/observer.bpf.c -o bpf/observer.bpf.o
          echo "=== BPF objects compiled ==="
          ls -lh bpf/*.bpf.o

      - name: Build release binary (with eBPF feature)
        run: cargo build --release --target x86_64-unknown-linux-gnu --locked --features ebpf

      - name: Verify binary has eBPF support
        run: |
          ./target/x86_64-unknown-linux-gnu/release/zelynic -V
          ./target/x86_64-unknown-linux-gnu/release/zelynic doctor || true

      - name: Prepare release artifacts
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PKG_NAME="zelynic-v${VERSION}-linux-amd64"
          mkdir -p "dist/${PKG_NAME}/man" "dist/${PKG_NAME}/bpf"

          # Copy binary
          cp target/x86_64-unknown-linux-gnu/release/zelynic "dist/${PKG_NAME}/zelynic"
          chmod +x "dist/${PKG_NAME}/zelynic"

          # Copy pre-compiled BPF objects (users don't need clang)
          cp bpf/limiter.bpf.o  "dist/${PKG_NAME}/bpf/"
          cp bpf/observer.bpf.o "dist/${PKG_NAME}/bpf/"

          # Copy documentation
          cp README.md LICENSE "dist/${PKG_NAME}/"

          # Copy install + uninstall scripts (for end-user convenience)
          cp scripts/install.sh "dist/${PKG_NAME}/install.sh"
          cp scripts/uninstall.sh "dist/${PKG_NAME}/uninstall.sh"
          chmod +x "dist/${PKG_NAME}/install.sh" "dist/${PKG_NAME}/uninstall.sh"

          # Copy test scripts (for VM/hardware testing)
          mkdir -p "dist/${PKG_NAME}/scripts"
          cp scripts/distros-depth-test.sh "dist/${PKG_NAME}/scripts/"
          cp scripts/leak-test.sh "dist/${PKG_NAME}/scripts/"
          cp scripts/stress-test.sh "dist/${PKG_NAME}/scripts/"
          cp scripts/benchmark.sh "dist/${PKG_NAME}/scripts/"
          cp scripts/long-endurance-test.sh "dist/${PKG_NAME}/scripts/"
          chmod +x "dist/${PKG_NAME}/scripts/"*.sh

          # Generate man page
          "./dist/${PKG_NAME}/zelynic" man > "dist/${PKG_NAME}/man/zelynic.1" 2>/dev/null || true
          if [ -f "dist/${PKG_NAME}/man/zelynic.1" ]; then
            gzip -f "dist/${PKG_NAME}/man/zelynic.1"
          fi

          # Create tar.gz archive
          cd dist
          tar -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"

          # Generate SHA512 checksum
          sha512sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha512sum"

          echo "PKG_NAME=${PKG_NAME}" >> "$GITHUB_ENV"

          # Cleanup extracted directory
          rm -rf "${PKG_NAME}"

          echo ""
          echo "=== Release artifacts ==="
          ls -lh

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-artifacts
          path: dist/*

  # ===========================================================================
  # Create GitHub Release
  # ===========================================================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          name: release-artifacts
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
