name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # Build Release Binary (amd64 Linux only, with eBPF support)
  # ===========================================================================
  build:
    name: Build Release Binary (eBPF)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,x86_64-unknown-linux-musl

      - name: Install BPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libbpf-dev linux-libc-dev

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-x86_64-unknown-linux-gnu-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-unknown-linux-gnu-cargo-release-

      - name: Compile BPF objects
        run: |
          set -e
          ARCH_INCLUDE=""
          if [[ -d "/usr/include/$(uname -m)-linux-gnu" ]]; then
            ARCH_INCLUDE="-I/usr/include/$(uname -m)-linux-gnu"
          fi
          clang -O2 -g -target bpf "${ARCH_INCLUDE}" \
              -c bpf/limiter.bpf.c -o bpf/limiter.bpf.o
          clang -O2 -g -target bpf "${ARCH_INCLUDE}" \
              -c bpf/observer.bpf.c -o bpf/observer.bpf.o
          echo "=== BPF objects compiled ==="
          ls -lh bpf/*.bpf.o

      - name: Build release binary (with eBPF feature)
        run: cargo build --release --target x86_64-unknown-linux-gnu --features ebpf

      - name: Build static binary (musl, for old glibc systems)
        run: cargo build --release --target x86_64-unknown-linux-musl --features ebpf

      - name: Verify binaries
        run: |
          echo "=== GNU binary ==="
          ./target/x86_64-unknown-linux-gnu/release/zelynic -V
          echo "=== MUSL binary ==="
          ./target/x86_64-unknown-linux-musl/release/zelynic -V
          echo "=== GNU ldd ==="
          ldd ./target/x86_64-unknown-linux-gnu/release/zelynic || true
          echo "=== MUSL ldd ==="
          ldd ./target/x86_64-unknown-linux-musl/release/zelynic || true

      - name: Prepare release artifacts
        run: |
          VERSION=${GITHUB_REF_NAME#v}

          # --- GNU (glibc) tarball ---
          PKG_GNU="zelynic-v${VERSION}-linux-amd64-gnu"
          mkdir -p "dist/${PKG_GNU}/man" "dist/${PKG_GNU}/bpf" "dist/${PKG_GNU}/scripts"
          cp target/x86_64-unknown-linux-gnu/release/zelynic "dist/${PKG_GNU}/zelynic"
          chmod +x "dist/${PKG_GNU}/zelynic"
          cp bpf/limiter.bpf.o  "dist/${PKG_GNU}/bpf/"
          cp bpf/observer.bpf.o "dist/${PKG_GNU}/bpf/"
          cp README.md LICENSE "dist/${PKG_GNU}/"
          cp scripts/install.sh scripts/uninstall.sh "dist/${PKG_GNU}/"
          chmod +x "dist/${PKG_GNU}/install.sh" "dist/${PKG_GNU}/uninstall.sh"
          cp scripts/distros-depth-test.sh scripts/leak-test.sh \
             scripts/stress-test.sh scripts/benchmark.sh \
             scripts/long-endurance-test.sh "dist/${PKG_GNU}/scripts/"
          chmod +x "dist/${PKG_GNU}/scripts/"*.sh
          "./dist/${PKG_GNU}/zelynic" man > "dist/${PKG_GNU}/man/zelynic.1" 2>/dev/null || true
          [ -f "dist/${PKG_GNU}/man/zelynic.1" ] && gzip -f "dist/${PKG_GNU}/man/zelynic.1"
          cd dist && tar -czf "${PKG_GNU}.tar.gz" "${PKG_GNU}"
          # Checksums: SHA-512 (classical) + BLAKE2b-512 + SHAKE256 (quantum-resistant)
          sha512sum "${PKG_GNU}.tar.gz" > "${PKG_GNU}.tar.gz.sha512sum"
          b2sum "${PKG_GNU}.tar.gz" > "${PKG_GNU}.tar.gz.b2sum"
          # SHAKE256 via Python (cross-platform, consistent 64-byte output)
          python3 -c "
          import hashlib
          data = open('${PKG_GNU}.tar.gz', 'rb').read()
          h = hashlib.shake_256(data).hexdigest(64)
          print(f'{h}  ${PKG_GNU}.tar.gz')
          " > "${PKG_GNU}.tar.gz.shake256"
          rm -rf "${PKG_GNU}" && cd ..

          # --- MUSL (static, for old glibc) tarball ---
          PKG_MUSL="zelynic-v${VERSION}-linux-amd64-musl"
          mkdir -p "dist/${PKG_MUSL}/man" "dist/${PKG_MUSL}/bpf" "dist/${PKG_MUSL}/scripts"
          cp target/x86_64-unknown-linux-musl/release/zelynic "dist/${PKG_MUSL}/zelynic"
          chmod +x "dist/${PKG_MUSL}/zelynic"
          cp bpf/limiter.bpf.o  "dist/${PKG_MUSL}/bpf/"
          cp bpf/observer.bpf.o "dist/${PKG_MUSL}/bpf/"
          cp README.md LICENSE "dist/${PKG_MUSL}/"
          cp scripts/install.sh scripts/uninstall.sh "dist/${PKG_MUSL}/"
          chmod +x "dist/${PKG_MUSL}/install.sh" "dist/${PKG_MUSL}/uninstall.sh"
          cp scripts/distros-depth-test.sh scripts/leak-test.sh \
             scripts/stress-test.sh scripts/benchmark.sh \
             scripts/long-endurance-test.sh "dist/${PKG_MUSL}/scripts/"
          chmod +x "dist/${PKG_MUSL}/scripts/"*.sh
          "./dist/${PKG_MUSL}/zelynic" man > "dist/${PKG_MUSL}/man/zelynic.1" 2>/dev/null || true
          [ -f "dist/${PKG_MUSL}/man/zelynic.1" ] && gzip -f "dist/${PKG_MUSL}/man/zelynic.1"
          cd dist && tar -czf "${PKG_MUSL}.tar.gz" "${PKG_MUSL}"
          # Checksums: SHA-512 (classical) + BLAKE2b-512 + SHAKE256 (quantum-resistant)
          sha512sum "${PKG_MUSL}.tar.gz" > "${PKG_MUSL}.tar.gz.sha512sum"
          b2sum "${PKG_MUSL}.tar.gz" > "${PKG_MUSL}.tar.gz.b2sum"
          # SHAKE256 via Python (cross-platform, consistent 64-byte output)
          python3 -c "
          import hashlib
          data = open('${PKG_MUSL}.tar.gz', 'rb').read()
          h = hashlib.shake_256(data).hexdigest(64)
          print(f'{h}  ${PKG_MUSL}.tar.gz')
          " > "${PKG_MUSL}.tar.gz.shake256"
          rm -rf "${PKG_MUSL}" && cd ..

          echo ""
          echo "=== Release artifacts ==="
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-artifacts
          path: dist/*

  # ===========================================================================
  # Create GitHub Release
  # ===========================================================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          name: release-artifacts
          path: dist

      - name: Generate release body
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)
          {
            if [ -n "$PREV_TAG" ]; then
              echo "## What's Changed"
              echo ""
              git log --no-merges --pretty=format:'- %s (%h)' "${PREV_TAG}..${GITHUB_REF_NAME}"
              echo ""
            else
              echo "Initial release."
            fi
          } > release-body.md
          echo "=== Release body ==="
          cat release-body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
