# =============================================================================
# CI Pipeline — runs on every push and PR to main
# =============================================================================

name: CI

on:
  push:
    branches: [main, wolf-architecture]
    paths:
      - '**/*.rs'
      - '**/*.toml'
      - '**/*.sh'
      - '**/*.py'
      - '**/*.c'
      - 'Cargo.lock'
      - 'build.rs'
      - 'rust-toolchain*'
      - 'deny.toml'
      - '.cargo/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, wolf-architecture]
    paths:
      - '**/*.rs'
      - '**/*.toml'
      - '**/*.sh'
      - '**/*.py'
      - '**/*.c'
      - 'Cargo.lock'
      - 'build.rs'
      - 'rust-toolchain*'
      - 'deny.toml'
      - '.cargo/**'
      - 'scripts/**'
      - '.github/workflows/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check dependency policies
        run: cargo deny check all

      - name: Run repository policy check
        run: python3 scripts/check-policy.py

      - name: Verify release build
        run: cargo build --release --locked

  ebpf-build:
    name: eBPF Build (Wolf Architecture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install clang + libbpf-dev + linux-headers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libbpf-dev
          sudo apt-get install -y "linux-headers-$(uname -r)" || \
            sudo apt-get install -y linux-headers-generic

      - name: Compile BPF observer
        run: clang -O2 -g -target bpf -c bpf/observer.bpf.c -o bpf/observer.bpf.o

      - name: Compile BPF limiter
        run: clang -O2 -g -target bpf -c bpf/limiter.bpf.c -o bpf/limiter.bpf.o

      - name: Verify BPF objects exist
        run: |
          test -f bpf/observer.bpf.o
          test -f bpf/limiter.bpf.o
          echo "✓ BPF objects compiled successfully"

      - name: Build Rust with ebpf feature
        run: cargo build --features ebpf --locked

      - name: Run tests with ebpf feature
        run: cargo test --features ebpf --locked

  workflow_quality:
    name: Workflow lint + codespell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install workflow lint tools
        run: |
          python3 -m pip install --user yamllint codespell
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "${HOME}/go/bin" >> "${GITHUB_PATH}"

      - name: Run actionlint
        run: actionlint .github/workflows/*.yml

      - name: Run yamllint
        run: yamllint .github/workflows

      - name: Run codespell
        run: |
          if [ -f .codespellrc ]; then
            codespell --config .codespellrc .
          else
            codespell --skip './.git,./target,./assets,./dist,./node_modules' .
          fi
