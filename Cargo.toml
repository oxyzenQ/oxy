[package]
name = "zelynic"
version = "3.1.1"
edition = "2021"
description = "Pure eBPF network rate limiter for Linux (Wolf Architecture)"
authors = ["rezky_nightky (oxyzenQ) <with dot rezky at gmail dot com>"]
license = "GPL-3.0-only"
repository = "https://github.com/oxyzenQ/zelynic"
readme = "README.md"
keywords = ["ebpf", "bandwidth", "network", "linux", "rate-limiting"]
categories = ["command-line-utilities", "network-programming"]
rust-version = "1.88.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
colored = "3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.31", features = ["process", "fs", "feature", "user"] }
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"

# eBPF support (optional)
[dependencies.aya]
version = "0.13"
optional = true

[features]
default = []
ebpf = ["aya"]

[profile.release]
opt-level = 3
debug = false
strip = true
lto = "thin"
codegen-units = 1
panic = "unwind"
overflow-checks = false
incremental = false

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
